# Talks, panels, workshops and conferences, shown on /talks/ (newest first, grouped by year).
#
#   - date: 2026-03-01            # YYYY-MM-DD (use the 1st when only the month is known)
#     precision: month            # day | month | year
#     role: Expert panellist       # what you did: Speaker, Presenter, Panellist, Workshop instructor, Session host, Organiser, Attendee
#     title: Talk or session title  # optional
#     event: Name of the conference, seminar or webinar
#     location: City, Country      # or "Online"
#     summary: One or two sentences on what you presented or contributed.
#     photos:                      # optional; put files in assets/img/events/ (JPG, about 1600px wide)
#       - file: 2026-policy-dialogue-1.jpg
#         alt: Describe what the photo shows, for screen readers
#     links:                       # optional: slides, recording, programme, news story
#       - { label: Slides, url: "https://..." }
#
# Events where you had a role (speaker, panellist, instructor, organiser) carry the most weight.
# Events you only attended are better kept short, or listed under `attended`.

- date: 2026-03-01
  precision: month
  role: Expert panellist
  title: "Policy Making Under Rapid Emergence: Theory, Evidence, and Research Utilisation in Southeast Asian Higher Education"
  event: International Higher Education Policy Dialogue
  summary: >-
    Spoke on the institutional challenges of adopting AI and on evidence-based strategies for responsible AI integration, with
    policymakers and academics from across Southeast Asia. Co-organised by Liverpool John Moores University, The British Academy,
    Lao Hong University, Prince of Songkla University and the University of the Philippines Cebu.

