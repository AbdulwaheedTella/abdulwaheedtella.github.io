  - role: Visiting Research Associate
    org: Curtin University, School of Design and Environment
    place: Australia
    dates: "Nov 2025 to Jan 2026"
    kind: research
    summary: GeoAI for flood susceptibility mapping, focused on when model predictions can be trusted.
    points:
      - Evaluated model reliability and identified the areas where machine-learning predictions are likely to fail, to improve their spatial validity.
    project: reliable-geoai-area-of-applicability

  - role: Doctoral Researcher, Civil Engineering
    org: Monash University Malaysia
    dates: "2023 to present"
    kind: academic
    summary: Explainable GeoAI for disaster risk reduction and environmental resilience, aligned with the Sustainable Development Goals.
    points:
      - Developing explainable-AI frameworks using SHAP, LIME and Accumulated Local Effects to make model reasoning transparent to non-technical stakeholders and policymakers.
      - Working with Google Earth Engine, Python, deep learning and statistical methods on complex multi-source geospatial data.
      - Best Student Paper Award, IEEE Geoscience and Remote Sensing Symposium, 2024.
    project: explainable-geoai-flood-susceptibility

  - role: Graduate Research Assistant
    org: Universiti Teknologi PETRONAS, Geospatial Analysis and Modelling (GAM) Research Group
    place: Malaysia
