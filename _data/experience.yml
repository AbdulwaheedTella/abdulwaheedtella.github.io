# Positions, newest first. `kind` is one of: research | academic | industry (used for the small label on the timeline).
# Text is adapted from the CV for the web; dates are as given on the CV.
positions:
  - role: PhD Intern, Research Excellence Unit
    org: Monash University Malaysia
    dates: "2026"
    kind: academic
    summary: Institutional research strategy and research data governance.
    points:
      - Contributing to research strategy through community engagement and research data governance working groups.
      - Working across faculties on research policy and open-science frameworks.

  - role: Research Fellow and Principal Investigator
    org: APNIC Foundation
    place: Australia
    dates: "Nov 2025 to Apr 2026"
    kind: research
    summary: "Mapping AI Capability Disparities Across ASEAN: Towards a Regional Policy Roadmap."
    points:
      - Led a multi-country study of AI and digital-technology capability gaps across Asia-Pacific institutions, linking geospatial analytics with AI governance and digital infrastructure policy.
      - Investigated institutional barriers to AI adoption and proposed evidence-based capacity-building strategies.
      - Supervised two research assistants in mixed-methods data collection and analysis.
      - Funded by an APNIC Foundation research fellowship (USD 10,000).
