      - Applied kriging, IDW and multivariate regression to spatiotemporal air-quality modelling.
      - Published four Q1 journal articles during the research assistantship and secured a full conference travel grant.
    project: air-quality-machine-learning-malaysia

  - role: Rhodium Research Cloud Scientist
